name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2 # Diperbarui ke rilis patch terbaru

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Diperbarui dari v4 ke v5 sesuai rekomendasi
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4.4.3 # Diperbarui ke rilis patch terbaru
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
